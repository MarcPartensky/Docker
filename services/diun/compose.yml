services:
  diun:
    image: crazymax/diun:latest
    container_name: diun
    restart: unless-stopped
    command: serve
    networks:
    - caddy
    volumes:
    - /srv/diun:/data
    - /var/run/docker.sock:/var/run/docker.sock
    env_file: .env
    labels:
      diun.enable: 'true'
networks:
  caddy:
    external: true
