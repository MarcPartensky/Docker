services:
  zitadel:
    image: ghcr.io/zitadel/zitadel:latest
    restart: unless-stopped
    command: >-
      start-from-init
      --config /config/config.yml
      --steps /config/steps.yml
      --masterkeyFromEnv
      --tlsMode external
    networks:
      - postgres
      - caddy
    volumes:
      - ../data/zitadel:/config
    env_file:
      - ../data/secrets/zitadel.env
    # https://github.com/zitadel/zitadel/issues/9495
    # healthcheck:
    #   test: ["CMD", "zitadel", "ready"]
    #   interval: 30s
    #   timeout: 20s
    #   retries: 3
    labels:
      traefik.enable: "true"
      traefik.http.routers.zitadel.entrypoints: web
        # traefik.http.routers.zitadel.tls.certresolver: cloudflare
      traefik.http.services.zitadel.loadbalancer.server.port: 8080
      traefik.http.routers.zitadel.rule: >
        Host(`auth.marcpartensky.com`)

networks:
  postgres:
    external: true
  caddy:
    external: true
