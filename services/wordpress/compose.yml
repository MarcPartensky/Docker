version: '3.9'
services:
  wordpress:
    image: wordpress
    restart: unless-stopped
    networks:
    - caddy
    - wordpress
    env_file: .env
    volumes:
    - wordpress:/var/www/html
    depends_on:
    - wordpress_mysql
    labels:
      caddy: wordpress.marcpartensky.com
      caddy.reverse_proxy: '{{upstreams}}'
      traefik.enable: 'true'
      traefik.http.routers.wordpress.rule: Host(`wordpress.marcpartensky.com`)
      traefik.http.routers.wordpress.entrypoints: websecure
      traefik.http.routers.wordpress.tls.certresolver: tls
      traefik.http.services.wordpress.loadbalancer.server.port: 80
    deploy:
      labels:
        traefik.enable: 'true'
        traefik.http.routers.wordpress.rule: Host(`wordpress.marcpartensky.com`)
        traefik.http.routers.wordpress.entrypoints: websecure
        traefik.http.routers.wordpress.tls.certresolver: tls
        traefik.http.services.wordpress.loadbalancer.server.port: 80
  wordpress_mysql:
    image: mysql
    restart: unless-stopped
    env_file: .env
    networks:
    - wordpress
    volumes:
    - wordpress_mysql:/var/lib/mysql
  phpmyadmin:
    image: phpmyadmin
    restart: unless-stopped
    env_file: .env
    networks:
    - wordpress
    ports:
    - 8880:80
    labels:
      caddy: phpmyadmin.marcpartensky.com
      caddy.reverse_proxy: '{{upstreams}}'
      traefik.enable: 'true'
      traefik.http.routers.wordpress.rule: Host(`wordpress.marcpartensky.com`)
      traefik.http.routers.wordpress.entrypoints: websecure
      traefik.http.routers.wordpress.tls.certresolver: tls
      traefik.http.services.wordpress.loadbalancer.server.port: 80
    deploy:
      labels:
        traefik.enable: 'true'
        traefik.http.routers.wordpress.rule: Host(`wordpress.marcpartensky.com`)
        traefik.http.routers.wordpress.entrypoints: websecure
        traefik.http.routers.wordpress.tls.certresolver: tls
        traefik.http.services.wordpress.loadbalancer.server.port: 80
volumes:
  wordpress: null
  wordpress_mysql: null
networks:
  wordpress: null
  caddy:
    external: true
