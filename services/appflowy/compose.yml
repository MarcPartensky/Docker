version: '3.9'
services:
  appflowy-nginx:
    restart: on-failure
    image: nginx
    volumes:
    - ../data/appflowy/nginx.conf:/etc/nginx/nginx.conf
    networks:
    - caddy
    labels:
      traefik.enable: 'true'
      traefik.http.services.appflowy.loadbalancer.server.port: 80
      traefik.http.routers.appflowy.rule: 'Host(`appflowy.marcpartensky.com`)

        '
      traefik.http.routers.appflowy.entrypoints: web
  gotrue:
    image: appflowyinc/gotrue:${GOTRUE_VERSION:-latest}
    restart: on-failure
    networks:
    - caddy
    - postgres
    env_file: .env
  appflowy-cloud:
    image: appflowyinc/appflowy_cloud:${BACKEND_VERSION:-latest}
    restart: on-failure
    env_file: .env
  appflowy-admin:
    restart: on-failure
    image: appflowyinc/admin_frontend:${BACKEND_VERSION:-latest}
    depends_on:
    - gotrue
    env_file: .env
networks:
  caddy:
    external: true
  postgres:
    external: true
  redis:
    external: true
