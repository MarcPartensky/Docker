services:
  n8n:
    image: marcpartensky/n8n
    restart: unless-stopped
    container_name: n8n
    env_file: .env
    ports:
    - 5678:5678
    user: 0:0
    networks:
    - redis
    - discord
    - postgres
    - caddy
    - mqtt
    volumes:
    - /srv/n8n:/home/node/n8n
    - /var/run/docker.sock:/var/run/docker.sock
    - /srv:/srv
    labels:
      traefik.enable: 'true'
      traefik.http.services.n8n.loadbalancer.server.port: 5678
      traefik.http.routers.n8n.rule: 'Host(`n8n.marcpartensky.com`)

        '
      traefik.http.routers.n8n.entrypoints: web
    healthcheck:
      test:
      - CMD
      - sh
      - -c
      - (wget -q -T 5 -O - http://127.0.0.1:5678/healthz 2>/dev/null | grep -qF '{"status":"ok"}')
        || exit 1
  n8n-worker:
    image: marcpartensky/n8n
    command: worker
    container_name: n8n-worker
    user: 0:0
    depends_on:
    - n8n
    networks:
    - redis
    - discord
    - postgres
    - caddy
    env_file: .env
    volumes:
    - /srv/n8n:/home/node/n8n
    - /var/run/docker.sock:/var/run/docker.sock
    - /srv:/srv
    healthcheck:
      test:
      - CMD
      - sh
      - -c
      - (wget -q -T 5 -O - http://127.0.0.1:5678/healthz 2>/dev/null | grep -qF '{"status":"ok"}')
        || exit 1
networks:
  discord:
    external: true
  caddy:
    external: true
  postgres:
    external: true
  redis:
    external: true
  mqtt:
    external: true
