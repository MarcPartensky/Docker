services:
  wger:
    image: docker.io/wger/server:latest
    container_name: wger
    restart: unless-stopped
    env_file: .env
    volumes:
    - static:/home/wger/static
    - media:/home/wger/media
    networks:
    - caddy
    - postgres
    - redis
    healthcheck:
      test: wget --no-verbose --tries=1 --spider http://localhost:8000
      interval: 10s
      timeout: 5s
      retries: 5
  wger_nginx:
    image: docker.io/nginx:stable
    container_name: wger-nginx
    restart: unless-stopped
    volumes:
    - ../data/wger/nginx.conf:/etc/nginx/conf.d/default.conf
    - static:/wger/static
    - media:/wger/media
    networks:
    - postgres
    - caddy
    healthcheck:
      test: service nginx status
      interval: 10s
      timeout: 5s
      retries: 5
    labels:
      traefik.enable: 'true'
      traefik.http.routers.wger_nginx.entrypoints: web
      traefik.http.services.wger_nginx.loadbalancer.server.port: 80
      traefik.http.routers.wger_nginx.rule: 'Host(`wger.marcpartensky.com`)

        '
  wger_celery_worker:
    image: docker.io/wger/server:latest
    container_name: wger-celery
    restart: unless-stopped
    command: /start-worker
    env_file: .env
    networks:
    - postgres
    - redis
    healthcheck:
      test: celery -A wger inspect ping
      interval: 10s
      timeout: 5s
      retries: 5
  wger_celery_beat:
    image: docker.io/wger/server:latest
    container_name: wger-celery-beat
    restart: unless-stopped
    command: /start-beat
    volumes:
    - celery-beat:/home/wger/beat/
    networks:
    - postgres
    - redis
    healthcheck:
      test:
      - CMD
      - celery
      - status
    env_file: .env
volumes:
  celery-beat: null
  static: null
  media: null
networks:
  redis:
    external: true
  caddy:
    external: true
  postgres:
    external: true
