version: "3.9"

services:
  ffsync:
    image: mozilla/syncserver:latest
    restart: unless-stopped
    env_file:
      - ../data/secrets/ffsync.env
    volumes:
      - /srv/ffsync:/data
    networks:
      - caddy
      - postgres
    labels:
      traefik.enable: "true"
      traefik.http.routers.ffsync.rule: Host(`ffsync.marcpartensky.com`)
      traefik.http.routers.ffsync.entrypoints: web
      traefik.http.services.ffsync.loadbalancer.server.port: 5000
    # labels:
    #   - traefik.enable: true
    #   - traefik.backend: ffsync
    #   - traefik.frontend.rule: Host:firefoxsync.${DOMAINNAME}
    #   - traefik.port: 5000
    #   - traefik.docker.network: caddy

  # ffsync_db:
  #   image: postgres:alpine
  #   container_name: ffsync_db
  #   restart: unless-stopped
  #   networks:
  #       - ffsync_network
  #   environment:
  #     POSTGRES_DB: ${FFSYNC_DATABASE_DB}
  #     POSTGRES_USER: ${FFSYNC_DATABASE_USER}
  #     POSTGRES_PASSWORD: ${FFSYNC_DB_PASSWORD}

networks:
  postgres:
    external: true
  caddy:
    external: true
