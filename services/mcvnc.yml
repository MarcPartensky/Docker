version: "3.9"

services:
  mcvnc:
    image: dorowu/ubuntu-desktop-lxde-vnc
    volumes:
      - /dev/shm:/dev/shm
      - /srv/mcvnc/home:/home/marc
      - /srv/mcvnc/usr:/usr
    ports:
      - 7900:5900
    environment:
      USER: marc
      PASSWORD: test
    networks:
      - minecraft
      - caddy
    # depends_on:
    #   - minecraft
    labels:
      # caddy: minecraft.marcpartensky.com, mc.marcpartensky.com
      # caddy.reverse_proxy: "{{upstreams}}"
      traefik.enable: "true"
      traefik.http.routers.mcvnc.rule: Host(`mc.marcpartensky.com`)
      traefik.http.routers.mcvnc.entrypoints: web
      # traefik.http.routers.mcvnc.entrypoints: websecure
      # traefik.http.routers.mcvnc.tls.certresolver: tls
      traefik.http.services.mcvnc.loadbalancer.server.port: 80
      traefik.http.routers.mcvnc.middlewares: ldap_auth

volumes:
  mcvnc:
  mcvnc_usr:

networks:
  minecraft:
  caddy:
    external: true
