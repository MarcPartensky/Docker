services:
  bookstack:
    restart: unless-stopped
    image: lscr.io/linuxserver/bookstack:24.12.1
    env_file: .env
    volumes:
    - /srv/bookstack:/config
    networks:
    - caddy
    - postgres
    labels:
      traefik.enable: 'true'
      traefik.http.routers.bookstack.rule: 'Host(`bookstack.marcpartensky.com`)

        '
      traefik.http.routers.bookstack.entrypoints: web
      traefik.http.services.bookstack.loadbalancer.server.port: 80
networks:
  postgres:
    external: true
  caddy:
    external: true
