services:
  mosquitto:
    image: eclipse-mosquitto
    restart: unless-stopped
    volumes:
      - /srv/mosquitto:/mosquitto
      # - /srv/mosquitto/data:/mosquitto/data
      # - /opt/mosquitto/log:/mosquitto/log
    # healthcheck:
    #   test: ["CMD", "mosquitto_sub", "-t", "$$SYS/#", "-C", "1", "-i", "healthcheck", "-W", "3"]
    ports:
      - 0.0.0.0:1883:1883
      - 0.0.0.0:9001:9001    
    networks:
      - mqtt

networks:
  mqtt:
    external: true

