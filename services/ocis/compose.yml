version: '3.9'
services:
  ocis:
    image: owncloud/ocis:latest
    environment:
      OCIS_INSECURE: 'true'
      OCIS_URL: https://ocis.marcpartensky.com
      OCIS_LOG_LEVEL: info
    ports:
    - 9200:9200
    - 9140:9140
    networks:
    - caddy
    - ldap
    env_file: .env
    labels:
      traefik.enable: 'true'
      traefik.http.services.ocis.loadbalancer.server.scheme: https
      traefik.http.services.ocis.loadbalancer.server.port: 9200
      traefik.http.routers.ocis.rule: 'Host(`ocis.marcpartensky.com`)

        '
      traefik.http.routers.ocis.entrypoints: web
networks:
  ldap:
    external: true
  caddy:
    external: true
