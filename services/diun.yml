services:
  diun:
    image: crazymax/diun:latest
    container_name: diun
    restart: unless-stopped
    command: serve
    networks:
      - caddy
    volumes:
      - "/srv/diun:/data"
      - "/var/run/docker.sock:/var/run/docker.sock"
    # env_file: ../data/secrets/diun.env
    environment:
      - "TZ=Europe/Paris"
      - "DIUN_WATCH_WORKERS=20"
      - "DIUN_WATCH_SCHEDULE=0 */6 * * *"
      - "DIUN_WATCH_JITTER=30s"
      - "DIUN_PROVIDERS_DOCKER=true"
    labels:
      diun.enable: "true"
      traefik.enable: "true"
      traefik.http.services.diun.loadbalancer.server.port: 8080
      traefik.http.routers.diun.rule: Host(`diun.marcpartensky.com`)
      traefik.http.routers.diun.entrypoints: web

  
networks:
  caddy:
    external: true
