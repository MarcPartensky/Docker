version: '3.9'
services:
  mailu:
    image: ${DOCKER_ORG:-ghcr.io/mailu}/${DOCKER_PREFIX:-}nginx:${MAILU_VERSION:-2.0}
    container_name: mailu
    restart: unless-stopped
    env_file: .env
    logging:
      driver: journald
      options:
        tag: mailu-front
    ports:
    - '25:25'
    - 465:465
    - 587:587
    - 110:110
    - 995:995
    - 143:143
    - 993:993
    networks:
    - mailu
    - radicale
    - caddy
    volumes:
    - /srv/mailu/certs:/certs
    - /srv/mailu/overrides/nginx:/overrides:ro
    depends_on:
    - resolver
    dns:
    - 192.168.203.254
  resolver:
    image: ${DOCKER_ORG:-ghcr.io/mailu}/${DOCKER_PREFIX:-}unbound:${MAILU_VERSION:-2.0}
    container_name: mailu-resolver
    env_file: .env
    restart: unless-stopped
    networks:
      mailu:
        ipv4_address: 192.168.203.254
  admin:
    image: ${DOCKER_ORG:-ghcr.io/mailu}/${DOCKER_PREFIX:-}admin:${MAILU_VERSION:-2.0}
    container_name: mailu-admin
    restart: unless-stopped
    env_file: .env
    logging:
      driver: journald
      options:
        tag: mailu-admin
    volumes:
    - /srv/mailu/data:/data
    - /srv/mailu/dkim:/dkim
    depends_on:
    - resolver
    dns:
    - 192.168.203.254
    networks:
    - redis
    - mailu
    - postgres
  imap:
    image: ${DOCKER_ORG:-ghcr.io/mailu}/${DOCKER_PREFIX:-}dovecot:${MAILU_VERSION:-2.0}
    container_name: mailu-imap
    restart: unless-stopped
    env_file: .env
    logging:
      driver: journald
      options:
        tag: mailu-imap
    volumes:
    - /srv/mailu/mail:/mail
    - /srv/mailu/overrides/dovecot:/overrides:ro
    depends_on:
    - mailu
    - resolver
    networks:
    - mailu
    dns:
    - 192.168.203.254
  smtp:
    image: ${DOCKER_ORG:-ghcr.io/mailu}/${DOCKER_PREFIX:-}postfix:${MAILU_VERSION:-2.0}
    container_name: mailu-smtp
    restart: unless-stopped
    env_file: .env
    logging:
      driver: journald
      options:
        tag: mailu-smtp
    volumes:
    - /srv/mailu/mailqueue:/queue
    - /srv/mailu/overrides/postfix:/overrides:ro
    depends_on:
    - mailu
    - resolver
    dns:
    - 192.168.203.254
    networks:
    - mailu
  oletools:
    image: ${DOCKER_ORG:-ghcr.io/mailu}/${DOCKER_PREFIX:-}oletools:${MAILU_VERSION:-2.0}
    container_name: mailu-oletools
    hostname: oletools
    restart: unless-stopped
    networks:
    - noinet
    - mailu
    - postgres
    depends_on:
    - resolver
    dns:
    - 192.168.203.254
  antispam:
    image: ${DOCKER_ORG:-ghcr.io/mailu}/${DOCKER_PREFIX:-}rspamd:${MAILU_VERSION:-2.0}
    container_name: mailu-antispam
    hostname: antispam
    restart: unless-stopped
    env_file: .env
    logging:
      driver: journald
      options:
        tag: mailu-antispam
    networks:
    - mailu
    - noinet
    - redis
    - postgres
    volumes:
    - /srv/mailu/filter:/var/lib/rspamd
    - /srv/mailu/overrides/rspamd:/overrides:ro
    depends_on:
    - mailu
    - oletools
    - resolver
    dns:
    - 192.168.203.254
  webdav:
    image: ${DOCKER_ORG:-ghcr.io/mailu}/${DOCKER_PREFIX:-}radicale:${MAILU_VERSION:-2.0}
    container_name: mailu-webdav
    restart: unless-stopped
    volumes:
    - /srv/mailu/dav:/data
    networks:
    - radicale
    - postgres
  fetchmail:
    image: ${DOCKER_ORG:-ghcr.io/mailu}/${DOCKER_PREFIX:-}fetchmail:${MAILU_VERSION:-2.0}
    container_name: mailu-fetchmail
    restart: unless-stopped
    env_file: .env
    volumes:
    - /srv/mailu/data/fetchmail:/data
    depends_on:
    - admin
    - smtp
    - imap
    - resolver
    dns:
    - 192.168.203.254
    networks:
    - mailu
networks:
  mailu:
    driver: bridge
    ipam:
      config:
      - subnet: 192.168.203.0/24
  caddy:
    external: true
  redis:
    external: true
  postgres:
    external: true
  radicale:
    driver: bridge
  noinet:
    driver: bridge
    internal: true
