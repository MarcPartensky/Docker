services:
  kutt:
    image: kutt/kutt
    restart: unless-stopped
    volumes:
    - /srv/kutt:/kutt/custom
    env_file: .env
    networks:
    - redis
    - postgres
    - caddy
    healthcheck:
      test: wget --no-verbose --tries=1 --spider http://localhost:3000
    labels:
      traefik.enable: 'true'
      traefik.http.services.kutt.loadbalancer.server.port: 3000
      traefik.http.routers.kutt.rule: 'Host(`kutt.marcpartensky.com`)

        '
      traefik.http.routers.kutt.entrypoints: web
      traefik.http.routers.kutt.middlewares: cloudflare@file
networks:
  redis:
    external: true
  postgres:
    external: true
  caddy:
    external: true
